name: Windows build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  release-x86:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build Release x86
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild was not found.' }
          & $msbuild vibrance.GUI.sln /nologo /m /p:Configuration=Release /p:Platform=x86
          exit $LASTEXITCODE
      - name: Upload Release x86
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vibranceGUI-Release-x86
          path: |
            vibrance.GUI/bin/x86/Release/vibrance.GUI.exe
            vibrance.GUI/bin/x86/Release/vibrance.GUI.exe.config
          if-no-files-found: error
