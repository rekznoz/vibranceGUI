name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      single_exe:
        description: Build the single executable (uncheck for the ZIP with lib)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release-x86:
    runs-on: windows-2022
    env:
      SINGLE_EXE: ${{ github.event_name != 'workflow_dispatch' || inputs.single_exe }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build Release x86
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild was not found.' }
          & $msbuild vibrance.GUI.sln /restore /nologo /m /p:Configuration=Release /p:Platform=x86 "/p:SingleExe=$env:SINGLE_EXE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SINGLE_EXE -ne 'true' -and !(Test-Path -LiteralPath 'vibrance.GUI/bin/x86/Release/Krypton.Toolkit.dll')) {
            throw 'Krypton.Toolkit.dll is missing from the build output.'
          }
      - name: Package Release x86
        if: ${{ env.SINGLE_EXE == 'false' }}
        shell: pwsh
        run: |
          $output = (Resolve-Path 'vibrance.GUI/bin/x86/Release').Path
          $package = Join-Path $env:RUNNER_TEMP 'vibranceGUI-Release-x86'
          $lib = Join-Path $package 'lib'
          New-Item -ItemType Directory -Path $lib -Force | Out-Null
          foreach ($name in 'vibrance.GUI.exe', 'vibrance.GUI.exe.config') {
            Copy-Item -LiteralPath (Join-Path $output $name) -Destination $package
          }
          Get-ChildItem -LiteralPath $output -Recurse -File -Filter '*.dll' | ForEach-Object {
            $relativePath = [IO.Path]::GetRelativePath($output, $_.FullName)
            $destination = Join-Path $lib $relativePath
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $destination
          }
      - name: Upload Release x86
        if: ${{ env.SINGLE_EXE == 'false' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vibranceGUI-Release-x86
          path: ${{ runner.temp }}/vibranceGUI-Release-x86/
          if-no-files-found: error
      - name: Verify single executable in isolation
        if: ${{ env.SINGLE_EXE == 'true' }}
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'vibranceGUI-SingleExe-x86'
          New-Item -ItemType Directory -Path $package | Out-Null
          $exe = Join-Path $package 'vibrance.GUI.exe'
          Copy-Item -LiteralPath 'vibrance.GUI/bin/x86/SingleExe/vibrance.GUI.exe' -Destination $exe
          $log = Join-Path $env:RUNNER_TEMP 'vibranceGUI-SingleExe-errors.log'
          $probe = Start-Process -FilePath $exe -ArgumentList '--verify-bundle' -WorkingDirectory $package -WindowStyle Hidden -RedirectStandardError $log -PassThru
          if (!$probe.WaitForExit(30000)) {
            $probe.Kill()
            throw 'The standalone executable did not finish its startup check.'
          }
          if ($probe.ExitCode -ne 0) {
            Get-Content -LiteralPath $log
            throw "Standalone startup check failed ($($probe.ExitCode))."
          }
      - name: Upload single executable
        if: ${{ env.SINGLE_EXE == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vibranceGUI-SingleExe-x86
          path: ${{ runner.temp }}/vibranceGUI-SingleExe-x86/vibrance.GUI.exe
          if-no-files-found: error
